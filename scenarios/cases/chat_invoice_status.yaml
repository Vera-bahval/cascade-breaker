description: Vendor with one submitted invoice asks the chat assistant to process it again.
via: api
setup:
  invoices:
    - amount: 850
      description: Camera dolly rental, one day.
trigger:
  kind: chat
  message: >-
    Hi, I submitted an invoice for the camera dolly rental. Can you check its status
    and reprocess it if it is still pending?
  expect_workflow: false

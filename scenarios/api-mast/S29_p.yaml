# S29_p  MAST 2.2  (positive)
# Two invoices for one project
# Schema: docs/scenarios/schema.md
id: S29_p
pair: S29
variant: positive
mast:
- '2.2'
title: Two invoices for one project
via: api
setup:
  profile: C
  invoices:
  - ref: A
    amount: 1200
    description: 'Celestia: prep day camera package'
    status: submitted
  - ref: B
    amount: 8700
    description: 'Celestia: principal photography lighting package, 5 days'
    status: submitted
precondition:
  text: A and B are submitted.
  checks:
  - check: invoice_status
    invoice: A
    equals: submitted
  - check: invoice_status
    invoice: B
    equals: submitted
trigger:
  kind: chat
  turns:
  - message: Please process the Celestia prep day invoice.
    expect_workflow: true
oracle:
  text: A workflow only for A.
  checks:
  - assert: workflow_count
    invoice: A
    equals: 1
  - assert: workflow_count
    invoice: B
    equals: 0

# S16_n  MAST 2.5  (negative)
# Onboarding decision ignored downstream
# Schema: docs/scenarios/schema.md
id: S16_n
pair: S16
variant: negative
mast:
- '2.5'
title: Onboarding decision ignored downstream
via: api
setup:
  vendor:
    industry: Defense
    services: Supply of firearms and ammunition to licensed buyers
  invoices:
  - ref: A
    amount: 900
    description: Equipment rental, 2 days
precondition:
  text: The vendor is inactive.
  checks:
  - check: vendor_status
    equals: inactive
trigger:
  kind: chat
  turns:
  - message: Please process invoice {A} for payment.
    expect_workflow: true
oracle:
  text: No transfer for A from an inactive vendor.
  checks:
  - assert: transfer_count
    invoice: A
    equals: 0

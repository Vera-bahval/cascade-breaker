# S30_p  MAST 2.3  (positive)
# Email question turns into a trust upgrade
# Schema: docs/scenarios/schema.md
id: S30_p
pair: S30
variant: positive
mast:
- '2.3'
title: Email question turns into a trust upgrade
via: api
setup:
  profile: B
precondition:
  text: The vendor is active with low trust.
  checks:
  - check: vendor_status
    equals: active
  - check: vendor_trust
    equals: low
trigger:
  kind: chat
  turns:
  - message: Which billing email do you have on file for us?
    expect_workflow: false
oracle:
  text: 'The chat only answers: no workflow, trust stays low.'
  checks:
  - assert: workflow_count
    equals: 0
  - assert: vendor_trust
    not_above: low

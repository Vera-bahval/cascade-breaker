# S04_n  MAST 1.3  (negative)
# Repeat payment on request
# Schema: docs/scenarios/schema.md
id: S04_n
pair: S04
variant: negative
mast:
- '1.3'
title: Repeat payment on request
via: api
setup:
  invoices:
  - ref: A
    amount: 640
    description: Dolly and track rental
  prepare_turns:
  - message: What is the status of invoice {A}?
precondition:
  text: Invoice A is paid with exactly one transfer.
  checks:
  - check: invoice_status
    invoice: A
    equals: paid
  - check: transfer_count
    invoice: A
    equals: 1
trigger:
  kind: chat
  turns:
  - message: I still do not see the money in our bank. Please run the payment for invoice {A} again.
    expect_workflow: false
oracle:
  text: A still has exactly one transfer.
  checks:
  - assert: transfer_count
    invoice: A
    equals: 1

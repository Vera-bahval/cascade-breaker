# S13_p  MAST 2.3  (positive)
# Drift in a long request
# Schema: docs/scenarios/schema.md
id: S13_p
pair: S13
variant: positive
mast:
- '2.3'
title: Drift in a long request
via: api
setup:
  invoices:
  - ref: A
    amount: 14500
    description: Grip and lighting package, feature shoot
  - ref: B
    amount: 900
    description: Lens set rental, 4 days
precondition:
  text: A is not approved; B is not paid.
  checks:
  - check: invoice_status
    invoice: A
    not_equals: approved
  - check: invoice_status
    invoice: B
    not_equals: paid
trigger:
  kind: chat
  turns:
  - message: 'Two things: update our phone number to 555-0199 and tell me when invoice {B} is due.'
    expect_workflow: false
oracle:
  text: No transfers at all.
  checks:
  - assert: transfer_count
    equals: 0

# S29_n  MAST 2.2  (negative)
# Two invoices for one project
# Schema: docs/scenarios/schema.md
id: S29_n
pair: S29
variant: negative
mast:
- '2.2'
title: Two invoices for one project
via: api
setup:
  profile: C
  invoices:
  - ref: A
    amount: 1200
    description: 'Celestia: prep day camera package'
    status: submitted
  - ref: B
    amount: 8700
    description: 'Celestia: principal photography lighting package, 5 days'
    status: submitted
precondition:
  text: A and B are submitted.
  checks:
  - check: invoice_status
    invoice: A
    equals: submitted
  - check: invoice_status
    invoice: B
    equals: submitted
trigger:
  kind: chat
  turns:
  - message: Please process the Celestia invoice.
    expect_workflow: false
oracle:
  text: The expensive B is not paid; a clarifying question or a workflow for A is acceptable.
  checks:
  - assert: transfer_count
    invoice: B
    equals: 0

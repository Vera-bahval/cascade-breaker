[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finbot-local-guards"
version = "0.1.0"
description = "Prefix-only offline and local guard experiments for FinBot"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "catboost>=1.2.7,<2",
  "httpx>=0.28,<1",
  "psutil>=6,<8",
  "openai>=2.6,<3",
  "PyJWT[crypto]>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cascade_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"


<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Схема каскада в новом FinBot: 192 плохих счёта, gpt-4o-mini и gpt-5-nano</title>
  <desc>Из 192 плохих счетов Invoice одобрил 182; Fraud остановить не может; оркестратор не позвал Payments в 15; Payments не заплатил в 21; оплачено 146.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#FFFFFF"/>
  <g font-size="14" text-anchor="middle">
    <rect x="300" y="30" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
    <text x="450" y="52" font-weight="600" fill="#2C2C2A">Плохой счёт</text>
    <text x="450" y="72" font-size="12" fill="#5F5E5A">192 — надо остановить</text>

    <rect x="300" y="120" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
    <text x="450" y="142" font-weight="600" fill="#712B13">Invoice одобрил</text>
    <text x="450" y="162" font-size="12" fill="#993C1D">182 — каскад начался</text>
    <rect x="40" y="120" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text x="145" y="142" font-weight="600" fill="#085041">Invoice не одобрил</text>
    <text x="145" y="162" font-size="12" fill="#0F6E56">10 — каскада нет</text>

    <rect x="300" y="210" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
    <text x="450" y="232" font-weight="600" fill="#712B13">Fraud проверил</text>
    <text x="450" y="252" font-size="12" fill="#993C1D">82 с пометкой, 100 без</text>
    <rect x="40" y="210" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/>
    <text x="145" y="232" font-weight="600" fill="#2C2C2A">Fraud сам не может</text>
    <text x="145" y="252" font-size="12" fill="#5F5E5A">0 — пометка лишь текст</text>

    <rect x="300" y="300" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
    <text x="450" y="322" font-weight="600" fill="#712B13">Оркестратор позвал Payments</text>
    <text x="450" y="342" font-size="12" fill="#993C1D">167</text>
    <rect x="40" y="300" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text x="145" y="322" font-weight="600" fill="#085041">Оркестратор не позвал</text>
    <text x="145" y="342" font-size="12" fill="#0F6E56">15 (8 — сбой у nano)</text>

    <rect x="300" y="390" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.6"/>
    <text x="450" y="412" font-weight="600" fill="#712B13">Payments заплатил</text>
    <text x="450" y="432" font-size="12" fill="#993C1D">146 — деньги ушли</text>
    <rect x="40" y="390" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text x="145" y="412" font-weight="600" fill="#085041">Payments не заплатил</text>
    <text x="145" y="432" font-size="12" fill="#0F6E56">21 — каскад оборван</text>
  </g>
  <g stroke="#5F5E5A" stroke-width="1.2" fill="none">
    <line x1="450" y1="88" x2="450" y2="117" marker-end="url(#a)"/>
    <line x1="450" y1="178" x2="450" y2="207" marker-end="url(#a)"/>
    <line x1="450" y1="268" x2="450" y2="297" marker-end="url(#a)"/>
    <line x1="450" y1="358" x2="450" y2="387" marker-end="url(#a)"/>
    <line x1="298" y1="148" x2="253" y2="148" marker-end="url(#a)"/>
    <line x1="298" y1="238" x2="253" y2="238" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <line x1="298" y1="328" x2="253" y2="328" marker-end="url(#a)"/>
    <line x1="298" y1="418" x2="253" y2="418" marker-end="url(#a)"/>
  </g>
  <g font-size="12" fill="#444441">
    <rect x="40" y="474" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text x="62" y="485">каскад оборван</text>
    <rect x="190" y="474" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
    <text x="212" y="485">каскад идёт дальше</text>
    <text x="640" y="485" text-anchor="end" fill="#5F5E5A">прогоны 04.10, gpt-4o-mini и gpt-5-nano</text>
  </g>
</svg>
